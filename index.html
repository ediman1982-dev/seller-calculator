<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор прибыльности продавца</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 28px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 32px 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f9fafb;
            color: #111827;
        }
        input[type="number"]:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .unit {
            position: absolute;
            right: 12px;
            font-size: 14px;
            color: #9ca3af;
            pointer-events: none;
            font-weight: 500;
        }
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 24px 0;
        }
        .results {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            text-align: center;
        }
        .result-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .result-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
        }
        .result-value {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            word-break: break-word;
        }
        .result-value.positive {
            color: #16a34a;
        }
        .result-value.negative {
            color: #dc2626;
        }
        .result-box.negative-bg {
            background-color: #fef2f2;
            border-radius: 8px;
            padding: 8px;
        }
        .btn-clear {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            color: #4b5563;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-clear:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        @media (max-width: 440px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор прибыльности</h1>
    <p class="subtitle">Расчёт прибыли и маржи с одной продажи</p>

    <div class="form-grid">
        <div class="form-group full-width">
            <label for="price">Цена продажи</label>
            <div class="input-wrapper">
                <input type="number" id="price" placeholder="0" step="any" min="0">
                <span class="unit">₽</span>
            </div>
        </div>

        <div class="form-group">
            <label for="cost">Себестоимость</label>
            <div class="input-wrapper">
                <input type="number" id="cost" placeholder="0" step="any" min="0">
                <span class="unit">₽</span>
            </div>
        </div>

        <div class="form-group">
            <label for="logistics">Логистика</label>
            <div class="input-wrapper">
                <input type="number" id="logistics" placeholder="0" step="any" min="0">
                <span class="unit">₽</span>
            </div>
        </div>

        <div class="form-group">
            <label for="commission">Комиссия</label>
            <div class="input-wrapper">
                <input type="number" id="commission" placeholder="0" step="any" min="0">
                <span class="unit">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="ads">Реклама</label>
            <div class="input-wrapper">
                <input type="number" id="ads" placeholder="0" step="any" min="0">
                <span class="unit">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="returns">Возвраты</label>
            <div class="input-wrapper">
                <input type="number" id="returns" placeholder="0" step="any" min="0">
                <span class="unit">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="tax">Налог</label>
            <div class="input-wrapper">
                <input type="number" id="tax" placeholder="0" step="any" min="0">
                <span class="unit">%</span>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="results">
        <div class="result-box" id="profit-box">
            <span class="result-label">Прибыль с продажи</span>
            <span class="result-value" id="profit-output">0.00 ₽</span>
        </div>
        <div class="result-box" id="margin-box">
            <span class="result-label">Маржа</span>
            <span class="result-value" id="margin-output">0.00 %</span>
        </div>
    </div>

    <button type="button" class="btn-clear" id="clear-btn">Очистить все поля</button>
</div>

<script>
    const inputs = [
        'price',
        'cost',
        'logistics',
        'commission',
        'ads',
        'returns',
        'tax'
    ];

    const profitOutput = document.getElementById('profit-output');
    const marginOutput = document.getElementById('margin-output');
    const profitBox = document.getElementById('profit-box');
    const clearBtn = document.getElementById('clear-btn');

    function getVal(id) {
        const val = parseFloat(document.getElementById(id).value);
        return isNaN(val) ? 0 : val;
    }

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function calculate() {
        const price = getVal('price');
        const cost = getVal('cost');
        const logistics = getVal('logistics');
        const commissionPct = getVal('commission');
        const adsPct = getVal('ads');
        const returnsPct = getVal('returns');
        const taxPct = getVal('tax');

        const commissionRub = price * (commissionPct / 100);
        const adsRub = price * (adsPct / 100);
        const returnsRub = price * (returnsPct / 100);
        const taxRub = price * (taxPct / 100);

        const profit = price - cost - logistics - commissionRub - adsRub - returnsRub - taxRub;
        const margin = price !== 0 ? (profit / price) * 100 : 0;

        profitOutput.textContent = formatNumber(profit) + ' ₽';
        marginOutput.textContent = formatNumber(margin) + ' %';

        profitOutput.classList.remove('positive', 'negative');
        profitBox.classList.remove('negative-bg');
        marginOutput.classList.remove('positive', 'negative');

        if (profit < 0) {
            profitOutput.classList.add('negative');
            profitBox.classList.add('negative-bg');
            marginOutput.classList.add('negative');
        } else if (profit > 0) {
            profitOutput.classList.add('positive');
            marginOutput.classList.add('positive');
        }
    }

    inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', calculate);
    });

    clearBtn.addEventListener('click', () => {
        inputs.forEach(id => {
            document.getElementById(id).value = '';
        });
        calculate();
    });
</script>

</body>
</html>
